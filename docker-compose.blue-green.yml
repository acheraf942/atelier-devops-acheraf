services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network


  app-blue:
    build: ./starter-app
    profiles: ["blue"]
    environment:
      - REDIS_HOST=redis
      - DEPLOY_COLOR=blue
    networks:
      - app-network

  app-green:
    build: ./starter-app
    profiles: ["green"]
    environment:
      - REDIS_HOST=redis
      - DEPLOY_COLOR=green
    networks:
      - app-network

networks:
  app-network:

volumes:
  redis-data:

